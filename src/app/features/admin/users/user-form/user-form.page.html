<ion-header class="ion-no-border group relative z-50">
    <div class="bg-white/80 dark:bg-[#0B0F19]/80 backdrop-blur-xl border-b border-gray-200/50 dark:border-gray-800/50 px-4 pt-4 pb-3 shadow-sm transition-all duration-300 relative"
        style="padding-top: calc(1rem + var(--ion-safe-area-top));">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <ion-buttons slot="start">
                    <ion-back-button defaultHref="/tabs/admin/users" class="text-gray-800 dark:text-white"
                        icon="chevron-back" text=""></ion-back-button>
                </ion-buttons>
                <div>
                    <h1 class="text-xl font-black text-gray-900 dark:text-white tracking-tight leading-tight">
                        {{ (isEditMode ? 'EDIT_USER' : 'CREATE_USER') | translate }}
                    </h1>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-0.5">
                        {{ isEditMode ? ('USER_DETAILS' | translate) : ('NEW_USER_ENTRY' | translate) }}
                    </p>
                </div>
            </div>

            <button (click)="saveUser()" [disabled]="loading"
                class="w-11 h-11 rounded-full bg-gradient-to-br from-saffron-500 to-orange-600 text-white flex items-center justify-center shadow-lg shadow-orange-500/30 active:scale-90 transition-all disabled:opacity-50 disabled:from-gray-300 disabled:to-gray-400 disabled:shadow-none">
                <ion-icon name="checkmark" class="text-xl"></ion-icon>
            </button>
        </div>
    </div>
</ion-header>

<ion-content class="bg-[#F8FAFC] dark:bg-[#0B0F19]">
    <div class="p-5 space-y-5 pb-32">
        <div *ngIf="error"
            class="bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 p-4 rounded-[1.25rem] text-[13px] font-bold border border-red-100 dark:border-red-800 shadow-sm animate-fade-in flex items-start">
            <ion-icon name="alert-circle" class="text-lg mr-2 shrink-0 mt-0.5"></ion-icon>
            <span>{{ error }}</span>
        </div>

        <div
            class="bg-gradient-to-br from-white to-gray-50 dark:from-gray-900 dark:to-gray-800/50 p-6 rounded-[1.5rem] border border-gray-100 dark:border-gray-800 relative overflow-hidden shadow-sm space-y-4">
            <div class="absolute top-0 left-0 bottom-0 w-1.5 bg-gradient-to-b from-blue-400 to-indigo-600"></div>

            <!-- Name -->
            <div class="space-y-2 relative z-10">
                <label
                    class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                    'NAME' | translate }} <span class="text-red-500">*</span></label>
                <div
                    class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center">
                    <ion-icon name="person-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
                    <input type="text" [(ngModel)]="userForm.name" placeholder="Full Name"
                        class="w-full text-[15px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
                </div>
            </div>

            <!-- Email -->
            <div class="space-y-2 relative z-10">
                <label
                    class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                    'EMAIL' | translate }} <span class="text-red-500">*</span></label>
                <div
                    class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center">
                    <ion-icon name="mail-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
                    <input type="email" [(ngModel)]="userForm.email" placeholder="email@example.com"
                        class="w-full text-[15px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
                </div>
            </div>

            <!-- Mobile -->
            <div class="space-y-2 relative z-10">
                <label
                    class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                    'MOBILE' | translate }}</label>
                <div
                    class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center">
                    <ion-icon name="call-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
                    <input type="tel" [(ngModel)]="userForm.mobile" placeholder="Mobile Number"
                        class="w-full text-[15px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
                </div>
            </div>

            <!-- Password -->
            <div class="space-y-2 relative z-10">
                <label
                    class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                    'PASSWORD' | translate }}</label>
                <div
                    class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center">
                    <ion-icon name="lock-closed-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
                    <input type="password" [(ngModel)]="userForm.password"
                        [placeholder]="isEditMode ? 'Leave blank to keep' : 'Password'"
                        class="w-full text-[15px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
                </div>
            </div>
        </div>

        <div
            class="bg-white dark:bg-gray-900 p-6 rounded-[1.5rem] shadow-sm border border-gray-100 dark:border-gray-800 space-y-5">

            <!-- Role -->
            <div class="space-y-2">
                <label
                    class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                    'ROLE' | translate }}</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-400">
                        <ion-icon name="shield-half-outline" class="text-lg"></ion-icon>
                    </div>
                    <select [(ngModel)]="userForm.role"
                        class="w-full bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-[1.25rem] pl-11 pr-5 py-4 text-[13px] font-bold uppercase tracking-widest text-gray-700 dark:text-white appearance-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 focus:bg-white transition-all">
                        <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none">
                        <ion-icon name="chevron-down" class="text-gray-400"></ion-icon>
                    </div>
                </div>
            </div>

            <!-- Department -->
            <div class="space-y-3 pt-3 border-t border-gray-100 dark:border-gray-800">
                <div class="flex justify-between items-center px-1">
                    <label
                        class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest">{{
                        'DEPARTMENT_LABEL' | translate }} <span class="text-red-500">*</span></label>
                    <button (click)="toggleAddDept()"
                        class="text-[10px] font-black text-blue-600 dark:text-blue-400 uppercase tracking-widest hover:text-blue-700 transition-colors flex items-center">
                        <ion-icon [name]="showAddDept ? 'close' : 'add'" class="mr-1 text-sm"></ion-icon>
                        {{ showAddDept ? 'CANCEL' : 'NEW' }}
                    </button>
                </div>

                <div *ngIf="showAddDept"
                    class="flex items-center space-x-2 animate-fade-in bg-blue-50 dark:bg-blue-900/10 p-2 rounded-[1.25rem] border border-blue-100 dark:border-blue-900/50">
                    <div
                        class="flex-1 bg-white dark:bg-gray-800 rounded-xl p-1 border border-gray-200 dark:border-gray-700 focus-within:border-blue-400 transition-all">
                        <input type="text" [(ngModel)]="newDeptName" placeholder="Dept Name"
                            class="w-full bg-transparent px-3 py-2 text-[14px] font-bold text-gray-900 dark:text-white border-none outline-none placeholder-gray-400">
                    </div>
                    <button (click)="saveNewDepartment()"
                        class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20 active:scale-95 transition-all outline-none">
                        <ion-icon name="checkmark" class="text-xl"></ion-icon>
                    </button>
                </div>

                <div class="relative" *ngIf="!showAddDept">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-400">
                        <ion-icon name="business-outline" class="text-lg"></ion-icon>
                    </div>
                    <select [(ngModel)]="userForm.departmentId"
                        class="w-full bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-[1.25rem] pl-11 pr-5 py-4 text-[14px] font-bold text-gray-700 dark:text-white appearance-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 focus:bg-white transition-all">
                        <option [ngValue]="null">General / No Department</option>
                        <option *ngFor="let dept of departments" [value]="dept.id">{{ dept.name }}</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none">
                        <ion-icon name="chevron-down" class="text-gray-400"></ion-icon>
                    </div>
                </div>
            </div>

            <!-- Designation -->
            <div class="space-y-2 pt-3 border-t border-gray-100 dark:border-gray-800">
                <label
                    class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                    'DESIGNATION' | translate }} <span class="text-red-500">*</span></label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-400">
                        <ion-icon name="briefcase-outline" class="text-lg"></ion-icon>
                    </div>
                    <select [(ngModel)]="userForm.designationId"
                        class="w-full bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-[1.25rem] pl-11 pr-5 py-4 text-[14px] font-bold text-gray-700 dark:text-white appearance-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 focus:bg-white transition-all">
                        <option [ngValue]="null">{{ 'NO_DESIGNATION' | translate }}</option>
                        <option *ngFor="let desig of designations" [value]="desig.id">{{ desig.name }}</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none">
                        <ion-icon name="chevron-down" class="text-gray-400"></ion-icon>
                    </div>
                </div>
            </div>

        </div>

    </div>
</ion-content>
