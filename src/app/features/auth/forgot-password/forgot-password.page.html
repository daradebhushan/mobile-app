<ion-content class="bg-gradient-to-b from-cream-50 to-gray-100 dark:from-gray-900 dark:to-black">
  <div class="min-h-screen flex flex-col items-center justify-center p-6 font-sans">

    <!-- Top Emblem & Branding -->
    <div class="text-center mb-10 animate-fade-in-up">
      <div class="w-24 h-24 mx-auto mb-4 relative drop-shadow-md">
        <svg class="w-full h-full text-saffron-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L15 8H9L12 2Z" />
          <path d="M4 8H20V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V8Z" opacity="0.8" />
          <circle cx="12" cy="14" r="3" class="text-white" fill="white" />
        </svg>
      </div>

      <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-1 tracking-tight">Nagar Panchayat Administration
      </h1>
      <h2 class="text-lg font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-widest">Government of
        Maharashtra</h2>
    </div>

    <!-- Forgot Password Card -->
    <div
      class="w-full max-w-md bg-white dark:bg-gray-900 rounded-3xl shadow-float p-8 border border-white/50 dark:border-gray-800 backdrop-blur-sm animate-fade-in-up delay-100">
      <div class="mb-8 text-center">
        <h3 class="text-xl font-bold text-gray-800 dark:text-white">Forgot Password?</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Enter your email address to reset your password.</p>
      </div>

      <form class="space-y-6" (ngSubmit)="onSubmit()">

        <!-- Email Input -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </div>
            <input type="email" [(ngModel)]="email" name="email" required
              class="block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-gray-700 rounded-xl leading-5 bg-gray-50 dark:bg-gray-800 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-900 focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 sm:text-sm transition duration-150 ease-in-out text-gray-900 dark:text-white"
              placeholder="name@example.com">
          </div>
        </div>

        <!-- Messages -->
        <div *ngIf="error" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg flex items-center">
          <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          {{ error }}
        </div>

        <div *ngIf="success" class="bg-green-50 text-green-600 text-sm p-3 rounded-lg flex items-center">
          <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          {{ success }}
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" [disabled]="loading || !email"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-saffron-600 hover:bg-saffron-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-saffron-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform hover:-translate-y-0.5">
            <span *ngIf="loading" class="mr-2 animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
            {{ loading ? 'Sending Link...' : 'Send Reset Link' }}
          </button>
        </div>

        <div class="text-center mt-4">
          <a routerLink="/home" class="text-sm text-saffron-600 hover:text-saffron-500 font-medium">Back to
            Login</a>
        </div>
      </form>
    </div>
  </div>
</ion-content>
