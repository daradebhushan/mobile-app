<ion-content [fullscreen]="true" class="bg-[#F8FAFC] dark:bg-[#0B0F19]">
  <div class="min-h-screen flex flex-col items-center justify-center p-6 relative">

    <!-- Top Branding -->
    <div class="text-center mb-10 relative z-10 w-full animate-fade-in-up">
      <div class="w-28 h-28 mx-auto mb-5 relative drop-shadow-lg">
        <!-- SVG Emblem -->
        <div class="absolute inset-0 bg-gradient-to-br from-saffron-400 to-orange-600 rounded-full blur-xl opacity-40">
        </div>
        <div
          class="relative bg-white dark:bg-gray-900 rounded-full p-6 shadow-md border border-gray-100 dark:border-gray-800">
          <svg class="w-full h-full text-gradient-to-br from-saffron-500 to-orange-600 dark:text-saffron-400"
            fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L15 8H9L12 2Z" />
            <path d="M4 8H20V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V8Z" opacity="0.8" />
            <circle cx="12" cy="14" r="3" class="text-white dark:text-gray-900" fill="currentColor" />
          </svg>
        </div>
      </div>
      <h1 class="text-[32px] font-black text-gray-900 dark:text-white mb-1.5 tracking-tight leading-none">Nagar
        Panchayat</h1>
      <h2 class="text-[13px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-[0.2em]">Administration</h2>
      <p class="text-[11px] font-bold text-gray-400 mt-2 tracking-wide">Official Mobile Application</p>
    </div>

    <!-- Login Card -->
    <div
      class="w-full max-w-md bg-white/90 dark:bg-gray-900/90 rounded-[2rem] shadow-xl shadow-gray-200/50 dark:shadow-black/50 p-8 border border-white dark:border-gray-800 backdrop-blur-xl relative z-10 animate-fade-in-up"
      style="animation-delay: 0.1s;">

      <div class="mb-8 pt-2">
        <h3 class="text-2xl font-black text-gray-900 dark:text-white tracking-tight">Welcome Back</h3>
        <p class="text-[13px] font-bold text-gray-400 mt-1">Please sign in to continue</p>
      </div>

      <form (ngSubmit)="login()" class="space-y-6">
        <!-- Error -->
        <div *ngIf="errorMessage"
          class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 text-[13px] p-4 rounded-[1.25rem] flex items-start font-bold border border-red-100 dark:border-red-900/50 shadow-sm animate-fade-in">
          <ion-icon name="alert-circle" class="text-lg mr-2 shrink-0"></ion-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Email -->
        <div class="space-y-2">
          <label
            class="block text-[11px] font-black text-gray-900 dark:text-gray-300 uppercase tracking-widest px-1">Email
            Address</label>
          <div
            class="relative bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-saffron-500/20 focus-within:border-saffron-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center">
            <ion-icon name="mail-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
            <input type="email" [(ngModel)]="email" name="email" required placeholder="name@example.com"
              class="w-full text-[15px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <div class="flex items-center justify-between px-1">
            <label
              class="block text-[11px] font-black text-gray-900 dark:text-gray-300 uppercase tracking-widest">Password</label>
            <a routerLink="/forgot-password"
              class="text-[11px] font-black text-blue-600 dark:text-blue-400 uppercase tracking-widest hover:text-blue-700 transition-colors">
              Recover?
            </a>
          </div>
          <div
            class="relative bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-saffron-500/20 focus-within:border-saffron-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center pr-12">
            <ion-icon name="lock-closed-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required
              placeholder="••••••••"
              class="w-full text-[15px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
            <button type="button" (click)="togglePassword()"
              class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center justify-center w-8 h-8 rounded-full text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
              <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" class="text-lg"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Button -->
        <button type="submit" [disabled]="!email || !password"
          class="w-full flex justify-center py-4 px-4 border border-transparent rounded-[1.25rem] shadow-xl shadow-orange-500/20 text-[14px] font-black text-white bg-gradient-to-br from-saffron-500 to-orange-600 hover:opacity-90 focus:outline-none focus:ring-4 focus:ring-orange-500/20 disabled:opacity-50 disabled:shadow-none transition-all duration-300 active:scale-95 uppercase tracking-widest mt-8">
          Sign In
        </button>

        <!-- Biometric Login Button -->
        <button type="button" *ngIf="isBiometricAvailable" (click)="loginWithBiometrics()"
          class="w-full flex items-center justify-center py-4 px-4 mt-4 border border-gray-200 dark:border-gray-700 rounded-[1.25rem] shadow-sm text-[13px] font-black uppercase tracking-widest text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-800 transition-all duration-300 active:scale-95">
          <ion-icon name="finger-print" class="text-xl mr-2 text-saffron-500"></ion-icon>
          Biometrics
        </button>
      </form>
    </div>

  </div>

</ion-content>
