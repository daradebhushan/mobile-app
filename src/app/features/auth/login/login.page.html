<ion-content [fullscreen]="true" class="bg-[#F8FAFC] dark:bg-[#0B0F19]">
  <div class="min-h-screen flex flex-col items-center justify-center p-6 relative saffron-mesh-bg">

    <!-- Ambient Glow Orbs -->
    <div class="absolute top-1/4 -left-12 w-64 h-64 bg-orange-500/15 dark:bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 -right-12 w-64 h-64 bg-amber-500/15 dark:bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-8 relative z-10 w-full animate-fade-in-up">
      <div class="w-28 h-28 mx-auto mb-4 relative drop-shadow-2xl">
        <div class="absolute inset-0 bg-gradient-to-br from-orange-400 to-amber-600 rounded-full blur-xl opacity-50"></div>
        <div
          class="relative bg-white dark:bg-gray-900 rounded-full p-2.5 shadow-lg border border-gray-100 dark:border-gray-800 flex items-center justify-center overflow-hidden">
          <img src="assets/loknagar-logo.png" alt="Loknagar Logo" class="w-full h-full object-contain" />
        </div>
      </div>
      <h1 class="text-3xl font-black text-gray-900 dark:text-white mb-1 tracking-tight leading-none">Loknagar</h1>
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-orange-50 dark:bg-orange-950/40 border border-orange-200/60 dark:border-orange-800/40 mt-1.5">
        <span class="status-dot bg-orange-500"></span>
        <span class="text-[10px] font-black text-orange-600 dark:text-orange-400 uppercase tracking-widest">Townseva Official Portal</span>
      </div>
    </div>

    <!-- Modern Login Card -->
    <div
      class="w-full max-w-md bg-white/90 dark:bg-gray-900/90 rounded-[28px] shadow-2xl shadow-orange-500/5 dark:shadow-black/60 p-7 sm:p-8 border border-white/80 dark:border-gray-800/90 backdrop-blur-2xl relative z-10 animate-fade-in-up"
      style="animation-delay: 0.1s;">

      <div class="mb-6 pt-1">
        <h3 class="text-2xl font-black text-gray-900 dark:text-white tracking-tight">Welcome Back</h3>
        <p class="text-xs font-semibold text-gray-400 mt-1">Sign in with your municipal credentials</p>
      </div>

      <div class="space-y-5">
        <!-- Error Alert -->
        <div *ngIf="errorMessage"
          class="bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 text-xs p-4 rounded-2xl flex items-start font-bold border border-rose-200/60 dark:border-rose-800/40 shadow-sm animate-fade-in">
          <ion-icon name="alert-circle" class="text-lg mr-2 shrink-0"></ion-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Email / Username Input -->
        <div class="space-y-1.5">
          <label
            class="block text-[10px] font-black text-gray-600 dark:text-gray-400 uppercase tracking-widest px-1">Email / Username</label>
          <div
            class="relative bg-gray-50 dark:bg-gray-800/60 p-3.5 rounded-2xl border border-gray-200/80 dark:border-gray-700/80 focus-within:ring-2 focus-within:ring-orange-500/30 focus-within:border-orange-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center shadow-inner">
            <ion-icon name="mail-outline" class="text-orange-500 mr-3 text-lg"></ion-icon>
            <input type="text" [(ngModel)]="email" name="email" required placeholder="name@townseva.in"
              class="w-full text-[14px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between px-1">
            <label
              class="block text-[10px] font-black text-gray-600 dark:text-gray-400 uppercase tracking-widest">Password</label>
            <a routerLink="/forgot-password"
              class="text-[10px] font-black text-orange-600 dark:text-orange-400 uppercase tracking-widest hover:underline transition-all">
              Forgot?
            </a>
          </div>
          <div
            class="relative bg-gray-50 dark:bg-gray-800/60 p-3.5 rounded-2xl border border-gray-200/80 dark:border-gray-700/80 focus-within:ring-2 focus-within:ring-orange-500/30 focus-within:border-orange-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center pr-11 shadow-inner">
            <ion-icon name="lock-closed-outline" class="text-orange-500 mr-3 text-lg"></ion-icon>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required
              placeholder="••••••••"
              class="w-full text-[14px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
            <button type="button" (click)="togglePassword()"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 flex items-center justify-center w-8 h-8 rounded-full text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
              <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" class="text-lg"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Sign In Button -->
        <button type="button" (click)="login()" [disabled]="!email || !password"
          class="w-full flex justify-center py-4 px-4 rounded-2xl shadow-xl shadow-orange-500/25 text-[13px] font-black text-white bg-gradient-to-r from-orange-500 via-orange-600 to-amber-600 hover:opacity-95 focus:outline-none disabled:opacity-50 disabled:shadow-none transition-all duration-200 active:scale-[0.98] uppercase tracking-widest mt-6">
          Sign In
        </button>

        <!-- Biometric Login Button -->
        <button type="button" *ngIf="isBiometricAvailable" (click)="loginWithBiometrics()"
          class="w-full flex items-center justify-center py-3.5 px-4 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm text-[12px] font-black uppercase tracking-wider text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-all duration-200 active:scale-[0.98]">
          <ion-icon name="finger-print" class="text-xl mr-2 text-orange-500"></ion-icon>
          Biometric Sign In
        </button>
      </div>
    </div>

  </div>
</ion-content>
