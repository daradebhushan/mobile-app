<ion-content class="bg-gradient-to-b from-cream-50 to-gray-100">
  <div class="min-h-screen flex flex-col items-center justify-center p-6 font-sans">

    <!-- Top Emblem & Branding -->
    <div class="text-center mb-10">
      <div class="w-24 h-24 mx-auto mb-4 relative drop-shadow-md">
        <svg class="w-full h-full text-saffron-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L15 8H9L12 2Z" />
          <path d="M4 8H20V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V8Z" opacity="0.8" />
          <circle cx="12" cy="14" r="3" class="text-white" fill="white" />
        </svg>
      </div>

      <h1 class="text-4xl font-bold text-gray-900 mb-1 tracking-tight">Nagar Panchayat Administration</h1>
      <h2 class="text-lg font-semibold text-gray-600 uppercase tracking-widest">Government of Maharashtra</h2>
    </div>

    <!-- Reset Password Card -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-float p-8 border border-white/50 backdrop-blur-sm">
      <div class="mb-8 text-center">
        <h3 class="text-xl font-bold text-gray-800">Reset Password</h3>
        <p class="text-sm text-gray-500 mt-1">Enter the OTP sent to your email.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- OTP Input -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Enter OTP</label>
          <div class="relative">
            <input type="text" [(ngModel)]="otp" name="otp" required maxlength="6"
              class="block w-full px-4 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 sm:text-sm transition duration-150 ease-in-out text-gray-900"
              placeholder="6-digit OTP">
          </div>
        </div>

        <!-- New Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <div class="relative">
            <input type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="6"
              class="block w-full px-4 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 sm:text-sm transition duration-150 ease-in-out text-gray-900"
              placeholder="Enter new password">
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
          <div class="relative">
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
              class="block w-full px-4 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 sm:text-sm transition duration-150 ease-in-out text-gray-900"
              placeholder="Confirm new password">
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg">
          {{ error }}
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" [disabled]="loading || !otp || !newPassword || !confirmPassword"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-saffron-600 hover:bg-saffron-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-saffron-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform hover:-translate-y-0.5">
            <span *ngIf="loading" class="mr-2 animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
            {{ loading ? 'Resetting...' : 'Reset Password' }}
          </button>
        </div>

        <div class="text-center mt-4">
          <a routerLink="/features/auth/forgot-password"
            class="text-sm text-saffron-600 hover:text-saffron-500 font-medium">Resend OTP</a>
        </div>
      </form>
    </div>
  </div>
</ion-content>
