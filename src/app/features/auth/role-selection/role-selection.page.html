<ion-content class="bg-gradient-to-b from-orange-50 to-gray-100 dark:from-gray-900 dark:to-black">
    <div class="min-h-screen flex flex-col items-center justify-center p-6 relative">

        <!-- Top Emblem & Branding -->
        <div class="text-center mb-10 w-full animate-fade-in-up">
            <div class="w-24 h-24 mx-auto mb-4 relative drop-shadow-md">
                <!-- Placeholder for Emblem/Ashoka Stambh -->
                <svg class="w-full h-full text-orange-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L15 8H9L12 2Z" /> <!-- Simple Crown Mock -->
                    <path d="M4 8H20V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V8Z" opacity="0.8" />
                    <circle cx="12" cy="14" r="3" class="text-white" fill="white" />
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-1 tracking-tight">{{ 'APP_TITLE' | translate
                }}</h1>
            <h2 class="text-base font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-widest">Nagar
                Panchayat Administration
            </h2>
            <p class="text-xs text-gray-500 dark:text-gray-500 mt-1 font-medium">{{ 'APP_SUBTITLE' | translate }}</p>
        </div>

        <!-- Main Card -->
        <div
            class="w-full max-w-md bg-white dark:bg-gray-900 rounded-3xl shadow-xl p-6 border border-white/50 dark:border-gray-800 backdrop-blur-sm">
            <h3 class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-6 text-center">{{ 'SELECT_ROLE' | translate
                }}</h3>

            <div class="space-y-4">
                <!-- Role Cards -->
                <div *ngFor="let role of roles" (click)="selectRole(role.id)"
                    class="relative overflow-hidden group border-2 rounded-2xl p-4 cursor-pointer transition-all duration-300 transform active:scale-95"
                    [ngClass]="selectedRole === role.id ? 'border-orange-500 bg-orange-50/50 dark:bg-orange-900/10 shadow-md' : 'border-transparent bg-gray-50 dark:bg-gray-800'">

                    <!-- Selection Indicator -->
                    <div *ngIf="selectedRole === role.id" class="absolute top-4 right-4 text-orange-600">
                        <ion-icon name="checkmark-circle" class="text-xl"></ion-icon>
                    </div>

                    <div class="flex items-center space-x-4">
                        <!-- Icon Container -->
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center transition-colors duration-300"
                            [ngClass]="selectedRole === role.id ? 'bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400' : 'bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-gray-400'">
                            <ion-icon [name]="role.icon" class="text-2xl"></ion-icon>
                        </div>

                        <div>
                            <div class="font-bold text-gray-900 dark:text-gray-100 leading-tight">{{ role.titleKey |
                                translate }}</div>
                            <div
                                class="text-[10px] text-gray-500 dark:text-gray-400 font-medium uppercase tracking-wide">
                                {{
                                role.subTextKey | translate }}</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Continue Button -->
            <button (click)="continue()" [disabled]="!selectedRole || loading"
                class="mt-8 w-full bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all duration-300 active:scale-95 disabled:opacity-50 disabled:shadow-none flex justify-center items-center">
                <ion-spinner *ngIf="loading" name="crescent" color="light" class="w-5 h-5 mr-2"></ion-spinner>
                {{ loading ? ('PROCESSING' | translate) : ('CONTINUE_AS' | translate) }}
            </button>
        </div>

        <!-- Footer -->
        <div class="mt-auto pt-8 text-center opacity-60">
            <p class="text-[10px] text-gray-600 font-medium">{{ 'VERSION' | translate }}</p>
        </div>

    </div>
</ion-content>
