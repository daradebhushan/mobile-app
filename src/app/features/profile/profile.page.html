<ion-header class="ion-no-border group relative z-50">
    <!-- Premium Glass Header -->
    <div class="bg-white/80 dark:bg-[#0B0F19]/80 backdrop-blur-xl border-b border-gray-200/50 dark:border-gray-800/50 px-4 pt-4 pb-3 shadow-sm transition-all duration-300 relative"
        style="padding-top: calc(1rem + var(--ion-safe-area-top));">

        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <button (click)="goBack()" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-800 dark:text-white hover:bg-gray-100 dark:hover:bg-gray-800 active:scale-95 transition-all">
                    <ion-icon name="chevron-back" class="text-2xl"></ion-icon>
                </button>
                <h1 class="text-xl font-black text-gray-900 dark:text-white tracking-tight">{{ 'USER_PROFILE' |
                    translate }}</h1>
            </div>

            <button (click)="onSubmit()" [disabled]="loading"
                class="w-10 h-10 rounded-full bg-gradient-to-br from-saffron-500 to-orange-600 text-white flex items-center justify-center shadow-md shadow-orange-500/30 active:scale-95 transition-all outline-none disabled:opacity-50 disabled:shadow-none">
                <ion-spinner *ngIf="loading" name="crescent" color="light" class="w-5 h-5"></ion-spinner>
                <ion-icon *ngIf="!loading" name="save" class="text-lg"></ion-icon>
            </button>
        </div>
    </div>
</ion-header>

<ion-content class="bg-[#F8FAFC] dark:bg-[#0B0F19]">
    <div class="p-5 pb-32 space-y-6" *ngIf="user; else loadingTpl">

        <!-- Profile Header Hero -->
        <div
            class="bg-gradient-to-br from-white to-gray-50 dark:from-gray-900 dark:to-gray-800/50 rounded-[1.5rem] border border-gray-100 dark:border-gray-800 relative overflow-hidden shadow-sm flex flex-col items-center justify-center p-8 mt-4">
            <!-- Decorative Accent -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-saffron-500/10 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>

            <div
                class="relative w-24 h-24 rounded-[1.5rem] bg-gradient-to-br from-saffron-400 to-orange-600 text-white flex items-center justify-center text-4xl font-black shadow-xl shadow-orange-500/30 ring-4 ring-white dark:ring-gray-800 mb-5 rotate-3 hover:rotate-0 transition-all duration-300">
                <span class="-rotate-3">{{ user.name ? user.name.charAt(0).toUpperCase() : 'U' }}</span>
            </div>

            <div class="text-center relative z-10">
                <h2 class="text-[22px] font-black text-gray-900 dark:text-white leading-tight mb-2 tracking-tight">{{
                    user.name }}</h2>
                <div
                    class="inline-flex items-center px-4 py-1.5 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 text-[10px] font-black uppercase tracking-widest rounded-full shadow-sm border border-blue-100 dark:border-blue-900/50">
                    <ion-icon name="shield-half" class="mr-1.5 text-sm"></ion-icon>
                    {{ user.role | translate }}
                </div>
            </div>
        </div>

        <div *ngIf="errorMessage"
            class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-4 rounded-[1.25rem] text-[13px] font-bold border border-red-100 dark:border-red-900/50 shadow-sm flex items-start animate-fade-in-up">
            <ion-icon name="alert-circle" class="text-lg mr-2 shrink-0"></ion-icon>
            <span>{{ errorMessage }}</span>
        </div>

        <!-- Form Section -->
        <div class="space-y-4">

            <div
                class="bg-white dark:bg-gray-900 p-6 rounded-[1.5rem] shadow-sm border border-gray-100 dark:border-gray-800 space-y-5 relative overflow-hidden">
                <div
                    class="absolute top-0 left-0 bottom-0 w-1 bg-gradient-to-b from-gray-200 to-gray-300 dark:from-gray-700 dark:to-gray-800">
                </div>

                <div class="space-y-2 relative z-10 pl-1">
                    <label
                        class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                        'FULL_NAME' | translate }}</label>
                    <div
                        class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-saffron-500/20 focus-within:border-saffron-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center">
                        <ion-icon name="person-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
                        <input type="text" [(ngModel)]="formData.name" placeholder="Your Name"
                            class="w-full text-[14px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
                    </div>
                </div>

                <div class="space-y-2 relative z-10 pl-1">
                    <label
                        class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                        'EMAIL_ADDRESS' | translate }}</label>
                    <div
                        class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-saffron-500/20 focus-within:border-saffron-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center">
                        <ion-icon name="mail-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
                        <input type="email" [(ngModel)]="formData.email" placeholder="you@example.com"
                            class="w-full text-[14px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
                    </div>
                </div>

                <div class="space-y-2 relative z-10 pl-1">
                    <label
                        class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                        'MOBILE_NUMBER' | translate }}</label>
                    <div
                        class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-saffron-500/20 focus-within:border-saffron-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center">
                        <ion-icon name="call-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
                        <input type="tel" [(ngModel)]="formData.mobile" placeholder="Mobile Number"
                            class="w-full text-[14px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
                    </div>
                </div>

            </div>

            <div
                class="bg-white dark:bg-gray-900 p-6 rounded-[1.5rem] shadow-sm border border-gray-100 dark:border-gray-800 space-y-5">

                <div class="space-y-2">
                    <label
                        class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                        'DEPARTMENT' | translate }}</label>
                    <div
                        class="bg-gray-100 dark:bg-gray-800 p-4 rounded-[1.25rem] border border-gray-100 dark:border-gray-700 flex items-center">
                        <ion-icon name="business" class="text-gray-400 mr-3 text-lg"></ion-icon>
                        <div class="w-full text-[14px] font-bold text-gray-500 dark:text-gray-400">{{
                            formData.department || 'Not Assigned' }}</div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label
                        class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                        'DESIGNATION' | translate }}</label>
                    <div
                        class="bg-gray-100 dark:bg-gray-800 p-4 rounded-[1.25rem] border border-gray-100 dark:border-gray-700 flex items-center">
                        <ion-icon name="briefcase" class="text-gray-400 mr-3 text-lg"></ion-icon>
                        <div class="w-full text-[14px] font-bold text-gray-500 dark:text-gray-400">{{
                            formData.designation || 'Not Assigned' }}</div>
                    </div>
                </div>

                <div class="pt-3 border-t border-gray-100 dark:border-gray-800">
                    <div class="space-y-2">
                        <label
                            class="block text-[11px] font-black text-gray-900 dark:text-white uppercase tracking-widest px-1">{{
                            'CHANGE_PASSWORD' | translate }} <span class="text-gray-400 font-bold ml-1">({{ 'OPTIONAL' |
                                translate }})</span></label>
                        <div
                            class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-[1.25rem] border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-saffron-500/20 focus-within:border-saffron-500 focus-within:bg-white dark:focus-within:bg-gray-800 transition-all flex items-center">
                            <ion-icon name="lock-closed-outline" class="text-gray-400 mr-3 text-lg"></ion-icon>
                            <input type="password" [(ngModel)]="formData.password" placeholder="••••••••"
                                class="w-full text-[14px] font-bold text-gray-900 dark:text-white border-none p-0 focus:ring-0 placeholder-gray-400 bg-transparent">
                        </div>
                    </div>
                </div>
            </div>

            <button (click)="onSubmit()" [disabled]="loading"
                class="w-full bg-gradient-to-br from-saffron-500 to-orange-600 text-white font-black uppercase tracking-widest py-4 rounded-[1.25rem] shadow-xl shadow-orange-500/20 transition-all active:scale-95 flex items-center justify-center space-x-2 disabled:opacity-50 disabled:shadow-none mt-6">
                <ion-spinner *ngIf="loading" name="crescent" color="light" class="w-5 h-5"></ion-spinner>
                <span *ngIf="!loading">{{ 'UPDATE_PROFILE' | translate }}</span>
            </button>
        </div>

    </div>

    <ng-template #loadingTpl>
        <div class="flex flex-col items-center justify-center h-full space-y-5 pb-20">
            <div class="w-16 h-16 relative">
                <div class="absolute inset-0 border-4 border-gray-100 dark:border-gray-800 rounded-full"></div>
                <div
                    class="absolute inset-0 border-4 border-saffron-500 rounded-full border-t-transparent animate-spin">
                </div>
            </div>
            <div class="text-[11px] font-black text-gray-400 uppercase tracking-widest">{{ 'LOADING' | translate }}...
            </div>
        </div>
    </ng-template>
</ion-content>
